<title>Garden Cells Architecture</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root {
    --paper: #f7f6f2;
    --box: #ffffff;
    --ink: #161614;
    --muted: #66655f;
    --accent: #2f7a33;
    --rule: #d9d7d0;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --paper: #141412;
        --box: #1c1c1a;
        --ink: #e8e6df;
        --muted: #9c9a92;
        --accent: #8cc46c;
        --rule: #33322e;
    }
}
:root[data-theme="dark"] {
    --paper: #141412;
    --box: #1c1c1a;
    --ink: #e8e6df;
    --muted: #9c9a92;
    --accent: #8cc46c;
    --rule: #33322e;
}

body {
    margin: 0;
    padding-block: 36px 48px;
    padding-inline: 20px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.5;
}
main { max-width: 1560px; margin: 0 auto; }

header { margin-bottom: 28px; }
h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-wrap: balance;
}
.sub { margin: 4px 0 0; color: var(--muted); }
.legend { margin: 14px 0 0; font-size: 12px; color: var(--muted); }
.legend span { white-space: nowrap; }

figure { margin: 0 0 44px; }
figure h2 {
    margin: 0 0 10px;
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
}
.scroll { overflow-x: auto; padding-bottom: 4px; }
svg {
    display: block;
    width: 100%;
    min-width: 1180px;
    height: auto;
    font-family: var(--mono);
    color: var(--ink);
}
figcaption { margin-top: 10px; max-width: 80ch; font-size: 12.5px; color: var(--muted); }

/* SVG parts */
.bx { fill: var(--box); stroke: currentColor; stroke-width: 1.5; }
.bx.fut { stroke-dasharray: 5 4; }
.bx.acc { stroke: var(--accent); stroke-width: 2; }
.gp { fill: none; stroke: currentColor; stroke-width: 1.75; }
.gp.dash { stroke-dasharray: 7 5; }
.t { font-size: 13px; fill: currentColor; }
.t.s { font-size: 11px; fill: var(--muted); }
.t.xs { font-size: 10.5px; fill: var(--muted); }
.t.h { font-size: 14px; font-weight: 600; }
.t.b { font-weight: 600; }
.t.c { font-size: 12.5px; fill: var(--accent); }
.ln { stroke: currentColor; stroke-width: 1.5; fill: none; }

table {
    border-collapse: collapse;
    width: 100%;
    max-width: 1100px;
    font-size: 13px;
}
th, td {
    text-align: left;
    vertical-align: top;
    padding: 8px 12px 8px 0;
    border-bottom: 1px solid var(--rule);
}
th { font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
td.st { white-space: nowrap; width: 10ch; }
.done { color: var(--accent); font-weight: 600; }
.now { font-weight: 600; }
.later { color: var(--muted); }
</style>

</header>

<figure>
    <h2>2 · Sign-in and sync</h2>
    <div class="scroll">
    <svg viewBox="0 0 1500 540" role="img" aria-label="The app starts locally, switches to SupabaseStore on sign-in and compares updatedAt to decide which side wins; a save goes to localStorage and Supabase, and realtime carries it to other devices.">
        <defs>
            <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
            </marker>
        </defs>

        <text class="t h" x="30" y="30">Start-up and sign-in</text>

        <rect class="bx" x="30" y="56" width="140" height="56"/>
        <text class="t" x="100" y="89" text-anchor="middle">App starts</text>
        <line class="ln" x1="170" y1="84" x2="203" y2="84" marker-end="url(#ah2)"/>

        <rect class="bx" x="205" y="56" width="190" height="56"/>
        <text class="t" x="300" y="89" text-anchor="middle">LocalStore.load()</text>
        <line class="ln" x1="395" y1="84" x2="428" y2="84" marker-end="url(#ah2)"/>

        <rect class="bx" x="430" y="56" width="150" height="56"/>
        <text class="t" x="505" y="89" text-anchor="middle">Render garden</text>
        <line class="ln" x1="580" y1="84" x2="613" y2="84" marker-end="url(#ah2)"/>

        <rect class="bx" x="615" y="56" width="210" height="56"/>
        <text class="t" x="720" y="89" text-anchor="middle">onAuthStateChange</text>

        <line class="ln" x1="825" y1="84" x2="863" y2="84" marker-end="url(#ah2)"/>
        <text class="t xs" x="845" y="48" text-anchor="middle">signed in (uid)</text>

        <text class="t xs" x="730" y="136">signed out</text>
        <rect class="bx" x="615" y="150" width="210" height="44"/>
        <text class="t" x="720" y="177" text-anchor="middle">Stays local</text>

        <rect class="bx" x="865" y="56" width="330" height="56"/>
        <text class="t" x="1030" y="79" text-anchor="middle">useStore(SupabaseStore,</text>
        <text class="t s" x="1030" y="99" text-anchor="middle">mirror = LocalStore)</text>
        <line class="ln" x1="1195" y1="84" x2="1228" y2="84" marker-end="url(#ah2)"/>
        <text class="t xs" x="1212" y="48" text-anchor="middle">load</text>

        <rect class="bx" x="1230" y="56" width="180" height="56"/>
        <text class="t" x="1320" y="89" text-anchor="middle">remote = load()</text>

        <polyline class="ln" points="1320,112 1320,190 1030,190" />
        <line class="ln" x1="1030" y1="190" x2="1030" y2="212" marker-end="url(#ah2)"/>
        <text class="t xs" x="1175" y="182" text-anchor="middle">compare updatedAt</text>

        <rect class="bx" x="865" y="214" width="330" height="44"/>
        <text class="t s" x="1030" y="241" text-anchor="middle">remote empty, local has plants → upload local</text>
        <rect class="bx" x="865" y="266" width="330" height="44"/>
        <text class="t s" x="1030" y="293" text-anchor="middle">remote newer → use remote, mirror to localStorage</text>
        <rect class="bx" x="865" y="318" width="330" height="44"/>
        <text class="t s" x="1030" y="345" text-anchor="middle">local newer → save() to Supabase</text>

        <line class="ln" x1="1195" y1="288" x2="1248" y2="288" marker-end="url(#ah2)"/>
        <rect class="bx" x="1250" y="266" width="220" height="44"/>
        <text class="t" x="1360" y="293" text-anchor="middle">Subscribe: postgres_changes</text>

        <text class="t xs" x="1290" y="372" text-anchor="end">the subscription delivers here</text>

        <text class="t" x="130" y="463" text-anchor="middle">User edits a cell</text>
        <line class="ln" x1="230" y1="458" x2="263" y2="458" marker-end="url(#ah2)"/>

        <rect class="bx" x="265" y="430" width="230" height="56"/>
        <text class="t" x="380" y="463" text-anchor="middle">persist(): updatedAt = now</text>
        <line class="ln" x1="495" y1="458" x2="528" y2="458" marker-end="url(#ah2)"/>

        <rect class="bx" x="530" y="430" width="200" height="56"/>
        <text class="t" x="630" y="463" text-anchor="middle">mirror → localStorage</text>
        <line class="ln" x1="730" y1="458" x2="763" y2="458" marker-end="url(#ah2)"/>

        <rect class="bx" x="765" y="430" width="230" height="56"/>
        <text class="t" x="880" y="453" text-anchor="middle">SupabaseStore.save()</text>
        <text class="t s" x="880" y="473" text-anchor="middle">(update gardens.data)</text>
        <line class="ln" x1="995" y1="458" x2="1028" y2="458" marker-end="url(#ah2)"/>
        <text class="t xs" x="880" y="506" text-anchor="middle">sync dot: yellow → green, red on error</text>

        <rect class="bx" x="1030" y="430" width="220" height="56"/>
        <text class="t" x="1140" y="453" text-anchor="middle">Realtime</text>
        <text class="t s" x="1140" y="473" text-anchor="middle">(to other devices)</text>
        <line class="ln" x1="1250" y1="458" x2="1283" y2="458" marker-end="url(#ah2)"/>

        <rect class="bx" x="1285" y="430" width="190" height="56"/>
        <text class="t" x="1380" y="463" text-anchor="middle">applyGarden + render</text>
        <text class="t xs" x="1380" y="506" text-anchor="middle">own writes ignored:</text>
        <text class="t xs" x="1380" y="520" text-anchor="middle">updatedAt ≤ lastSeen</text>
    </svg>
    </div>
    <figcaption>The first render always comes from localStorage, so the garden is on screen before the network answers. On sign-in, updatedAt decides which side wins, and an empty cloud account receives the device's garden. Every save goes to both stores; realtime carries it to the other devices, which ignore their own writes.</figcaption>
</figure>

                <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
