<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex, follow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e1e1e">
<title>Refreshing cells.garden</title>
<style>
html,body{margin:0;height:100%;background:#1e1e1e;color:#dadada;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:center}p{opacity:.72}
</style>
<p>Updating cells.garden…</p>
<script>
(async()=>{
  try{
    const regs=await navigator.serviceWorker?.getRegistrations?.()||[];
    await Promise.all(regs.map(r=>r.unregister()));
    const keys=await caches?.keys?.()||[];
    await Promise.all(keys.map(k=>caches.delete(k)));
  }catch{}
  location.replace('/?fresh='+Date.now());
})();
</script>
