<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 21 21" shape-rendering="crispEdges">
  <!-- The logo (src/assets/CG_logo_v1.png) pixel for pixel: 21 across, the plant
       half a pixel down, as the logo has it. "npm run icons" renders every size. -->
  <!-- Drawn smaller than one screen pixel to a logo pixel (a 16 px favicon), crisp
       edges would drop whole lines, the stem among them: there it blends instead. -->
  <style>@media (max-width: 20.99px) { svg { shape-rendering: auto; } }</style>
  <rect width="21" height="21" fill="#1b217e"/>
  <!-- leaves and stem -->
  <g fill="#3a7a83">
    <rect x="5" y="5.5" width="2" height="1"/>
    <rect x="10" y="5.5" width="1" height="1"/>
    <rect x="3" y="6.5" width="5" height="1"/>
    <rect x="10" y="6.5" width="1" height="1"/>
    <rect x="7" y="7.5" width="4" height="1"/>
    <rect x="14" y="7.5" width="2" height="1"/>
    <rect x="10" y="8.5" width="1" height="1"/>
    <rect x="13" y="8.5" width="5" height="1"/>
    <rect x="10" y="9.5" width="4" height="1"/>
    <rect x="10" y="10.5" width="1" height="1"/>
  </g>
  <!-- flower -->
  <g fill="#74f951">
    <rect x="9" y="1.5" width="3" height="1"/>
    <rect x="8" y="2.5" width="2" height="1"/>
    <rect x="11" y="2.5" width="2" height="1"/>
    <rect x="8" y="3.5" width="5" height="1"/>
    <rect x="9" y="4.5" width="3" height="1"/>
  </g>
  <!-- the flower's eye -->
  <g fill="#7fec57">
    <rect x="10" y="2.5" width="1" height="1"/>
  </g>
  <!-- seed -->
  <g fill="#241423">
    <rect x="9" y="11.5" width="3" height="1"/>
    <rect x="9" y="12.5" width="3" height="1"/>
    <rect x="10" y="13.5" width="1" height="1"/>
  </g>
  <!-- roots -->
  <g fill="#496f4f">
    <rect x="10" y="14.5" width="1" height="1"/>
    <rect x="3" y="15.5" width="8" height="1"/>
    <rect x="3" y="16.5" width="1" height="1"/>
    <rect x="5" y="16.5" width="1" height="1"/>
    <rect x="7" y="16.5" width="1" height="1"/>
    <rect x="10" y="16.5" width="1" height="1"/>
    <rect x="13" y="16.5" width="1" height="1"/>
    <rect x="15" y="16.5" width="1" height="1"/>
    <rect x="17" y="16.5" width="1" height="1"/>
    <rect x="10" y="17.5" width="8" height="1"/>
    <rect x="10" y="18.5" width="1" height="1"/>
  </g>
</svg>
