function walkTo(tx){if(mode==='flying'||mode==='takingoff'||mode==='landing')return;targetX=clamp(tx,56,innerWidth-56);face(targetX-x);mode='walking';lastAction=performance.now();play('walk')}
function hopTo(tx){if(mode==='flying'||mode==='takingoff'||mode==='landing')return;targetX=clamp(tx,56,innerWidth-56);face(targetX-x);mode='hopping';lastAction=performance.now();var sx=x,sy=groundY(),dx=targetX-sx,st=performance.now(),duration=620;play('hop');function hopFrame(now){if(mode!=='hopping')return;var q=clamp((now-st)/duration,0,1);place(sx+dx*q,sy-Math.sin(Math.PI*q)*62);if(q<1)requestAnimationFrame(hopFrame);else becomeIdle()}requestAnimationFrame(hopFrame)}
function takeoff(){if(mode==='takingoff'||mode==='landing')return;if(mode==='flying'){face(-dir);flightTarget=dir>0?innerWidth-66:66;return}lastAction=performance.now();mode='takingoff';face(x<innerWidth*.5?1:-1);flightTarget=dir>0?innerWidth-66:66;var sx=x,sy=groundY(),ay=airY();actionStarted=performance.now();play('takeoff',true,function(){if(mode!=='takingoff')return;mode='flying';flyY=ay;play('fly')});function lift(now){if(mode!=='takingoff')return;var q=clamp((now-actionStarted)/630,0,1);place(sx+dir*58*q,sy+(ay-sy)*q);if(q<1)requestAnimationFrame(lift)}requestAnimationFrame(lift)}
function land(){if(mode!=='flying')return;mode='landing';var sx=x,sy=y,gx=clamp(x,64,innerWidth-64),gy=groundY();actionStarted=performance.now();play('land',true,becomeIdle);function descend(now){if(mode!=='landing')return;var q=clamp((now-actionStarted)/690,0,1),e=1-Math.pow(1-q,2);place(sx+(gx-sx)*e,sy+(gy-sy)*e);if(q<1)requestAnimationFrame(descend)}requestAnimationFrame(descend)}
function crowTap(){held=false;if(mode==='flying'){face(-dir);flightTarget=dir>0?innerWidth-66:66}else takeoff()}
function call(){if(mode==='flying'||mode==='takingoff'||mode==='landing')return;mode='calling';lastAction=performance.now();play('call',true,becomeIdle)}
function peck(){if(mode!=='grounded')return;mode='pecking';lastAction=performance.now();play('peck',true,becomeIdle)}
crow.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();if(crow.setPointerCapture)crow.setPointerCapture(e.pointerId);pressStart={x:e.clientX,y:e.clientY,t:performance.now()};held=false;pressTimer=setTimeout(function(){if(pressStart){held=true;call()}},520)});
crow.addEventListener('pointerup',function(e){e.preventDefault();e.stopPropagation();clearTimeout(pressTimer);var p=pressStart;pressStart=null;if(!p||held)return;if(Math.hypot(e.clientX-p.x,e.clientY-p.y)<10&&performance.now()-p.t<520)crowTap()});
crow.addEventListener('pointercancel',function(){clearTimeout(pressTimer);pressStart=null});
crow.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();crowTap()}});
world.addEventListener('pointerup',function(e){if(e.target===crow||crow.contains(e.target))return;var now=performance.now();if(now-lastTap<290){lastTap=0;hopTo(e.clientX)}else{lastTap=now;walkTo(e.clientX)}});
function tick(now){var dt=Math.min(40,now-lastFrame);lastFrame=now;if(mode==='walking'){var dx=targetX-x,s=.15*dt;if(Math.abs(dx)<=s+1){place(targetX,groundY());becomeIdle()}else place(x+Math.sign(dx)*s,groundY())}else if(mode==='flying'){var fx=flightTarget-x,fs=.35*dt;place(x+Math.sign(fx)*Math.min(Math.abs(fx),fs),flyY+Math.sin(now/235)*8);if(Math.abs(fx)<8)land()}if(mode==='grounded'&&now-lastAction>4500&&now-idleClock>3300){idleClock=now;peck()}requestAnimationFrame(tick)}
addEventListener('resize',function(){x=clamp(x,56,innerWidth-56);if(mode==='grounded'||mode==='walking')place(x,groundY())});
place(x,groundY());play('idle');requestAnimationFrame(tick);
if(new URLSearchParams(location.search).get('test')==='fly')setTimeout(takeoff,180);
window.crowNPC={fly:takeoff,walkTo:walkTo,hopTo:hopTo,call:call,peck:peck,get state(){return{state:state,mode:mode,x:x,y:y}}};
})();
</script>
