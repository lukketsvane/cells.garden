<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#081018">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>cells.garden · fox NPC</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081018;touch-action:none}
body{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-user-select:none;user-select:none}
#world{position:fixed;inset:0;overflow:hidden;background:linear-gradient(to bottom,#081018 0 54%,#111a20 54% 100%)}
#world:after{content:"";position:absolute;left:0;right:0;top:54%;height:1px;background:#25303a}
#fox{
 position:absolute;left:50%;top:54%;width:192px;height:192px;
 transform:translate(-50%,-76%);
 background-image:url('/fox-npc-atlas.png');
 background-repeat:no-repeat;
 background-size:768px 1152px;
 image-rendering:pixelated;
 image-rendering:crisp-edges;
 -webkit-touch-callout:none;
 cursor:pointer;
}
#fox.flip{transform:translate(-50%,-76%) scaleX(-1)}
#state{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;color:#7f91a3;font-size:10px;opacity:.72}
#hint{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));color:#7f91a3;font-size:11px;text-align:center;opacity:.78}
</style>
</head>
<body>
<div id="world">
 <div id="fox" role="button" aria-label="interactive pixel fox"></div>
 <div id="state">idle</div>
 <div id="hint">tap fox → jump/run · tap ground → move · double-tap → dig · hold fox → sit</div>
</div>
<script>
(()=>{
 const fox=document.getElementById('fox'),world=document.getElementById('world'),stateEl=document.getElementById('state');
 const A={
  idle:{row:0,frames:4,d:180},
  run:{row:1,frames:4,d:85},
  jump:{row:2,frames:4,d:95},
  dig:{row:3,frames:4,d:125},
  sit:{row:4,frames:4,d:180},
  sleep:{row:5,frames:4,d:230}
 };
 let state='idle',frame=0,timer=null,x=innerWidth*.5,target=x,dir=1,moving=false,lastAction=Date.now();
 let pressTimer=null,pressed=false,lastTap=0,holdTriggered=false;
 const CELL=192;
 function setX(v){x=Math.max(56,Math.min(innerWidth-56,v));fox.style.left=x+'px'}
 function setDir(d){dir=d;fox.classList.toggle('flip',d<0)}
 function draw(){const a=A[state]||A.idle;fox.style.backgroundPosition=(-frame*CELL)+'px '+(-a.row*CELL)+'px';stateEl.textContent=state}
 function play(s,once=false,done=null,reverse=false){clearInterval(timer);state=A[s]?s:'idle';const a=A[state];frame=reverse?a.frames-1:0;draw();timer=setInterval(()=>{frame+=reverse?-1:1;const end=reverse?frame<0:frame>=a.frames;if(end){if(once){clearInterval(timer);done&&done();return}frame=reverse?a.frames-1:0}draw()},a.d)}
 function moveTo(tx){target=tx;setDir(target>=x?1:-1);moving=true;lastAction=Date.now();play('run')}
 function stop(){moving=false;play('idle')}
 function foxTap(){lastAction=Date.now();if(state==='sleep'){play('sleep',true,()=>play('idle'),true);return}setDir(Math.random()<.5?-1:1);const tx=x+dir*Math.min(innerWidth*.28,130+Math.random()*90);play('jump',true,()=>moveTo(tx))}
 function tick(){if(moving){const speed=4.1*(innerWidth/390),dx=target-x;if(Math.abs(dx)<speed+3){setX(target);stop()}else setX(x+Math.sign(dx)*speed)}else{const idleFor=Date.now()-lastAction;if(idleFor>9000&&state!=='sleep')play('sleep')}requestAnimationFrame(tick)}
 fox.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();pressed=true;holdTriggered=false;pressTimer=setTimeout(()=>{if(pressed){holdTriggered=true;lastAction=Date.now();moving=false;play('sit')}},520)});
 fox.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();pressed=false;clearTimeout(pressTimer);if(holdTriggered){play('idle');return}foxTap()});
 fox.addEventListener('pointercancel',()=>{pressed=false;clearTimeout(pressTimer)});
 world.addEventListener('pointerup',e=>{if(e.target===fox)return;lastAction=Date.now();const now=Date.now();if(now-lastTap<280){lastTap=0;moving=false;play('dig',true,()=>play('idle'));return}lastTap=now;moveTo(e.clientX)});
 addEventListener('resize',()=>setX(Math.min(x,innerWidth-56)));
 setX(x);play('idle');requestAnimationFrame(tick);
})();
</script>
</body>
</html>
