<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#081018">
<title>cells.garden · crow</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081018;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#world{position:fixed;inset:0;overflow:hidden;background:
linear-gradient(#081018 0 34%,#171a31 34% 52%,#2a2948 52% 61%,#11191d 61%)}
#stars{position:absolute;inset:0 0 39% 0;opacity:.8;background-image:
radial-gradient(circle at 7% 14%,#d8e0ff 0 1px,transparent 1.5px),
radial-gradient(circle at 18% 29%,#7985a5 0 1px,transparent 1.5px),
radial-gradient(circle at 31% 9%,#d8e0ff 0 1px,transparent 1.5px),
radial-gradient(circle at 45% 25%,#7985a5 0 1px,transparent 1.5px),
radial-gradient(circle at 58% 16%,#d8e0ff 0 1px,transparent 1.5px),
radial-gradient(circle at 70% 32%,#7985a5 0 1px,transparent 1.5px),
radial-gradient(circle at 84% 12%,#d8e0ff 0 1px,transparent 1.5px),
radial-gradient(circle at 94% 28%,#7985a5 0 1px,transparent 1.5px)}
#ridge{position:absolute;left:-5%;right:-5%;top:43%;height:19%;background:
linear-gradient(135deg,transparent 0 12%,#1f2237 12% 30%,transparent 30%),
linear-gradient(45deg,transparent 0 27%,#1f2237 27% 47%,transparent 47%),
linear-gradient(136deg,transparent 0 50%,#20233a 50% 69%,transparent 69%),
linear-gradient(44deg,transparent 0 67%,#20233a 67% 88%,transparent 88%)}
#ground{position:absolute;left:0;right:0;top:61%;bottom:0;background:#11191d}
#ground:before{content:"";position:absolute;left:0;right:0;top:-8px;height:12px;background:
repeating-linear-gradient(90deg,#26371f 0 12px,#354a2b 12px 18px,#1a2b1c 18px 27px,#2c4025 27px 42px)}
#crow{position:absolute;left:0;top:0;width:96px;height:96px;padding:0;border:0;background:none;z-index:5;touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
#crow img{position:absolute;inset:0;width:96px;height:96px;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none;transform-origin:50% 50%}
#crow.left img{transform:scaleX(-1)}
#crow[data-state="flying"] img{animation:wingbob 180ms steps(2,end) infinite}
@keyframes wingbob{50%{transform:translateY(-3px)}}
#crow.left[data-state="flying"] img{animation:wingbobleft 180ms steps(2,end) infinite}
@keyframes wingbobleft{50%{transform:translateY(-3px) scaleX(-1)}0%,100%{transform:scaleX(-1)}}
#title{position:absolute;z-index:9;top:max(14px,env(safe-area-inset-top));left:16px;color:#eaf0f6;font:700 18px/1 ui-monospace,SFMono-Regular,Menlo,monospace}
#state{display:block;margin-top:7px;color:#9cff63;font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}
#hint{position:absolute;z-index:9;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));color:#7e8c99;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center}
#mark{position:absolute;width:8px;height:8px;border:1px solid #a3b0bd;transform:translate(-50%,-50%);opacity:0;pointer-events:none}
#mark.ping{animation:ping .45s steps(3,end)}
@keyframes ping{0%{opacity:1;width:8px;height:8px}100%{opacity:0;width:30px;height:30px}}
</style>
<div id="world">
  <div id="stars"></div><div id="ridge"></div><div id="ground"></div>
  <div id="title">cells.garden<span id="state">idle</span></div>
  <button id="crow" aria-label="Crow. Tap to fly."><img alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAABbUlEQVR4nO2VzU6DQBSFTxsTiRKUv9CfGJI2aXwB48P4Wr6N8QV06aZpggkxUMlQUIKmbhxXg0xL22EguuFbwTDcc++5cwHo6Ojo+Gd6bQRRVIPaoyk03QYAZCnBy+JRKHa/qfjF7IqW7+9uh0VSIu8fyQorqkHXecJVmaUE1zeE21N+vrlfKgEW1B5NQUIUAiT0uH1VYlUIbWI93kTTbWQp4dZEe8+o7YCm27CcMbeWpWTLAVFqH8KlP69MqsqhVhIo2/+RrQAAcRTg6eEecRRwScggNQWWMy7aEEcBlv4cp5oplcDBA8NO/Yl6DgAYupfcc9YSlgAJPeEJAARawILtq1C2ekDAAWMwoZ/5G4BfF3YlwCahNQeMwYSzf1+lMuLADgeYMKt8nSe98mfVMS18H58BAPpf74hWsZQ4UDEFimrQ5PV5KxAX3LQoCT1u9mXEpXHdGa26lqHx77gptWw7VK3vL/6uDR0dbfED34mHkrnn5lQAAAAASUVORK5CYII="></button>
  <div id="mark"></div>
  <div id="hint">tap crow → fly · tap while flying → turn · tap ground → walk there</div>
</div>
<script>
(()=> {
  const world=document.querySelector('#world'), crow=document.querySelector('#crow');
  const stateEl=document.querySelector('#state'), mark=document.querySelector('#mark');
  const EDGE=48, HALF=48, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const groundY=()=>innerHeight*.61-22;
  let x=clamp(innerWidth*.68,EDGE,innerWidth-EDGE), y=groundY(), dir=-1, state='idle';
  let raf=0, token=0, idleTimer=0, press=null;
  const setState=s=>{state=s;crow.dataset.state=s;stateEl.textContent=s};
  const face=d=>{dir=d>=0?1:-1;crow.classList.toggle('left',dir<0)};
  const place=(nx,ny)=>{x=Math.round(nx);y=Math.round(ny);crow.style.transform=`translate3d(${x-HALF}px,${y-HALF}px,0)`};
  const stop=()=>{token++;if(raf)cancelAnimationFrame(raf);raf=0};
  const schedule=()=>{clearTimeout(idleTimer);idleTimer=setTimeout(()=>{if(state==='idle')walk()},2200+Math.random()*3200)};
  function walk(tx){
    if(state!=='idle')return;
    clearTimeout(idleTimer);setState('walking');
    tx=tx==null?clamp(x+(Math.random()<.5?-1:1)*(55+Math.random()*120),EDGE,innerWidth-EDGE):clamp(tx,EDGE,innerWidth-EDGE);
    face(tx-x);const t=++token;let last=performance.now();
    const step=now=>{if(t!==token||state!=='walking')return;const dt=Math.min(40,now-last);last=now;const dx=tx-x;place(x+Math.sign(dx||dir)*Math.min(Math.abs(dx),.11*dt),groundY()-Math.abs(Math.sin(now/85))*2);if(Math.abs(dx)<2){setState('idle');place(tx,groundY());schedule();return}raf=requestAnimationFrame(step)};
    raf=requestAnimationFrame(step);
  }
  function land(){
    stop();setState('landing');const sx=x,sy=y,ex=clamp(x,EDGE,innerWidth-EDGE),ey=groundY(),start=performance.now(),t=++token;
    const step=now=>{if(t!==token||state!=='landing')return;const p=clamp((now-start)/560,0,1),e=1-Math.pow(1-p,2);place(sx+(ex-sx)*e,sy+(ey-sy)*e);if(p>=1){setState('idle');place(ex,ey);schedule();return}raf=requestAnimationFrame(step)};
    raf=requestAnimationFrame(step);
  }
  function fly(){
    clearTimeout(idleTimer);
    if(state==='flying'){face(-dir);return}
    if(state==='takingoff'||state==='landing')return;
    stop();setState('takingoff');face(x<innerWidth/2?1:-1);
    const sx=x,sy=groundY(),air=clamp(innerHeight*.29,95,groundY()-120),start=performance.now(),t=++token;
    const lift=now=>{if(t!==token||state!=='takingoff')return;const p=clamp((now-start)/520,0,1),e=1-Math.pow(1-p,3);place(sx+dir*50*e,sy+(air-sy)*e);if(p>=1){setState('flying');cross();return}raf=requestAnimationFrame(lift)};
    raf=requestAnimationFrame(lift);
  }
  function cross(){
    const sx=x,sy=y,tx=dir>0?innerWidth-EDGE:EDGE,dist=Math.max(1,Math.abs(tx-sx)),start=performance.now(),t=++token;
    const step=now=>{if(t!==token||state!=='flying')return;const p=clamp((now-start)/1900,0,1);place(sx+(tx-sx)*p,sy-Math.sin(Math.PI*p)*54+Math.sin(now/110)*3);if(p>=1){land();return}raf=requestAnimationFrame(step)};
    raf=requestAnimationFrame(step);
  }
  crow.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();press={x:e.clientX,y:e.clientY};crow.setPointerCapture?.(e.pointerId)});
  crow.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();const p=press;press=null;if(p&&Math.hypot(e.clientX-p.x,e.clientY-p.y)<12)fly()});
  crow.addEventListener('pointercancel',()=>press=null);
  world.addEventListener('pointerup',e=>{if(e.target===crow||crow.contains(e.target))return;mark.style.left=e.clientX+'px';mark.style.top=e.clientY+'px';mark.classList.remove('ping');void mark.offsetWidth;mark.classList.add('ping');if(state==='idle')walk(e.clientX)});
  addEventListener('resize',()=>{x=clamp(x,EDGE,innerWidth-EDGE);if(state==='idle')place(x,groundY())});
  face(dir);place(x,y);schedule();
})();
</script>
