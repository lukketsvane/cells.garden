<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, follow">
    <title>cells.garden</title>
    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            background: #0b1220;
            color: #d7e3f4;
            font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }
        body[hidden] { display: none; }
        main {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
        }
        section {
            width: min(420px, 100%);
            padding: 18px 20px;
            border: 1px solid #26344f;
            border-radius: 10px;
            background: #111b2e;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 16px;
            color: #eef4ff;
        }
        p {
            margin: 0;
            color: #9fb0c8;
        }
    </style>
    <script src="/privacy/oauth-extension-start.js" defer></script>
</head>
<body hidden>
    <main>
        <section>
            <h1>Google sign-in could not start</h1>
            <p id="status"></p>
        </section>
    </main>
</body>
</html>
