name: Verify beta 0.2 proposal
on:
  push:
    branches: [beta-workspace]
    paths: [.github/workflows/beta-workspace.yml, 'changes/**']
permissions:
  contents: read
concurrency:
  group: beta-proposal
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 41960b42002f03bb5b0ec9a9da8dcab91286a8e9
          path: app
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: proposal
          persist-credentials: false
      - name: Verify and apply the proposal
        run: |
          test "$(git rev-parse HEAD)" = 41960b42002f03bb5b0ec9a9da8dcab91286a8e9
          sed -i 's/^ deleted file mode /deleted file mode /' ../proposal/changes/02.patch
          cd ../proposal/changes
          sha256sum -c <<'HASHES'
          47bb1da73c1ab8598511778552f2e393ff86fb0ef4886bf5a24b0c8f0c8e582f  01.patch
          b77e4a54a559b4a94a5bf077f6f3dfbbe82e66bcfc16d6b0c5c0dc923f2a2627  02.patch
          51df98fc6b60156e068b78c504955607acb5ee3eb8aa69e7e362140e8ecb6b78  03.patch
          2ba33f10ea793108a9c5afadf4ed6b463f156a8a413e08ed3a38d31f2fbca714  04.patch
          830a1927da5a6e1b8b96b62572372c5a244d9bbfdfddb0efc2c8362b3baba315  05.patch
          HASHES
          cd ../../app
          git apply --unidiff-zero --index ../proposal/changes/01.patch ../proposal/changes/02.patch ../proposal/changes/03.patch
          git apply --index ../proposal/changes/04.patch ../proposal/changes/05.patch
          git diff --cached --check
          mkdir -p "$RUNNER_TEMP/beta-results/screenshots"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Audit, security, typechecks, lint, unit tests and all builds
        run: |
          for check in audit:prod test:security typecheck typecheck:ext typecheck:obsidian typecheck:test lint test:unit build; do
            npm run "$check" 2>&1 | tee "$RUNNER_TEMP/beta-results/${check//:/-}.log"
          done
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Web, Chrome, Obsidian and static-page browser tests
        env:
          SCREENSHOTS: ${{ runner.temp }}/beta-results/screenshots
          EXT_TEST_SCREENSHOTS: ${{ runner.temp }}/beta-results/screenshots
          SEO_SCREENSHOTS: ${{ runner.temp }}/beta-results/screenshots
        run: |
          for check in test:web test:ext test:obsidian test:seo; do
            npm run "$check" 2>&1 | tee "$RUNNER_TEMP/beta-results/${check//:/-}.log"
          done
      - name: Package verified outputs
        run: |
          mkdir -p "$RUNNER_TEMP/beta-verified"
          git add obsidian-plugin/main.js obsidian-plugin/styles.css obsidian-plugin/manifest.json
          git diff --cached --binary HEAD > "$RUNNER_TEMP/beta-verified/verified.patch"
          git diff --cached --name-only > "$RUNNER_TEMP/beta-verified/changed-files.txt"
          (cd dist-ext && zip -qr "$RUNNER_TEMP/beta-verified/cells-garden-chrome-0.2.0.zip" .)
          (cd obsidian-plugin && zip -q "$RUNNER_TEMP/beta-verified/cells-garden-obsidian-0.2.0.zip" main.js styles.css manifest.json)
          (cd dist && zip -qr "$RUNNER_TEMP/beta-verified/cells-garden-web-0.2.0.zip" .)
          cd "$RUNNER_TEMP/beta-verified"
          sha256sum *.zip verified.patch > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: beta-validation-results
          path: ${{ runner.temp }}/beta-results/
          retention-days: 3
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta-verified-release
          path: ${{ runner.temp }}/beta-verified/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: beta-0.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: beta-verified-release
          path: ${{ runner.temp }}/beta-verified
      - name: Commit only the verified beta branch
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 41960b42002f03bb5b0ec9a9da8dcab91286a8e9
          (cd "$RUNNER_TEMP/beta-verified" && sha256sum -c SHA256SUMS)
          git apply --index "$RUNNER_TEMP/beta-verified/verified.patch"
          git config user.name tastefinger
          git config user.email 41840333+lukketsvane@users.noreply.github.com
          git commit -m "Prepare 0.2.0 beta across web, Chrome and Obsidian"
          git push origin HEAD:beta-0.2
          git rev-parse HEAD
