name: Publish Figma artwork to dev

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/figma-publish.yml'

permissions:
  contents: write

concurrency:
  group: figma-dev-artwork
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Pull approved Figma PNGs
        id: pull
        run: node scripts/pull-figma-dev.mjs
      - name: Validate the dev build
        if: steps.pull.outputs.changed == 'true'
        run: |
          npm ci --ignore-scripts
          npm run verify:figma-assets
          npm run typecheck
          npm run lint
          npm run build:web
      - name: Commit approved artwork to dev
        if: steps.pull.outputs.changed == 'true'
        run: |
          git config user.name tastefinger
          git config user.email 41840333+lukketsvane@users.noreply.github.com
          git add src/assets public/figma-dev-state.json
          git commit -m "Publish approved Figma artwork"
          git pull --rebase origin dev
          git push origin HEAD:dev
      - name: Verify dev.cells.garden
        if: steps.pull.outputs.changed == 'true'
        run: node scripts/verify-figma-host.mjs dev.cells.garden figma-dev-state.json ${{ steps.pull.outputs.revision }}
