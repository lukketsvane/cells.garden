name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Figma asset contract
        run: npm run verify:figma-assets
      - name: Typecheck web
        run: npm run typecheck
      - name: Typecheck extension
        run: npm run typecheck:ext
      - name: Typecheck Obsidian
        run: npm run typecheck:obsidian
      - name: Typecheck tests
        run: npm run typecheck:test
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Full build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Web/PWA smoke
        run: npm run test:web
