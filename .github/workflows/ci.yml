name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Production dependency audit
        run: npm run audit:prod
      - name: Security invariants
        run: npm run test:security
      - name: Typecheck web
        run: npm run typecheck
      - name: Typecheck extension
        run: npm run typecheck:ext
      - name: Typecheck Obsidian
        run: npm run typecheck:obsidian
      - name: Typecheck tests
        run: npm run typecheck:test
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Full build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Web/PWA smoke
        run: npm run test:web
      - name: Chrome extension smoke
        run: npm run test:ext
      - name: Obsidian plugin smoke
        run: npm run test:obsidian
