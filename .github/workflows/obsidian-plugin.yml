# Keeps the committed Obsidian plugin build (obsidian-plugin/) in step with the
# code, so pulling the repo is all it takes to update the plugin in a vault that
# links to that folder. On main it also publishes the GitHub release Obsidian's
# plugin directory installs from, once per version in the root manifest.json.
name: Build the Obsidian plugin

on:
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'ext/**'
      - 'public/privacy/oauth-return.html'
      - 'obsidian-plugin/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vite.obsidian.config.ts'
      - 'manifest.json'
      - '.env'
      - '.github/workflows/obsidian-plugin.yml'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: obsidian-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Figma asset contract
        run: npm run verify:figma-assets
      - name: Typecheck Chrome extension
        run: npm run typecheck:ext
      - name: Build Chrome extension
        run: npm run build:ext
      - run: npm run build:obsidian
      - name: Check compact Obsidian kanban
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const css = fs.readFileSync('obsidian-plugin/styles.css', 'utf8');
          if (!/\.kanban-scroll-container\s+\.project-column\s*\{[^}]*display:\s*flex/s.test(css)) {
            throw new Error('Obsidian build is missing the compact per-plant kanban layout');
          }
          if (/\.kanban-scroll-container\s+\.project-column\s*\{[^}]*grid-template-rows:\s*subgrid/s.test(css)) {
            throw new Error('Obsidian build still contains the shared-row kanban spacing');
          }
          const js = fs.readFileSync('obsidian-plugin/main.js', 'utf8');
          if (/navigator\.clipboard|\.clipboardData\b/.test(js)) {
            throw new Error('Obsidian build still accesses the system clipboard');
          }
          if (/loadLocalStorage|saveLocalStorage/.test(js)) {
            throw new Error('Obsidian build still uses legacy local storage APIs');
          }
          const gardenSource = fs.readFileSync('src/core/garden.ts', 'utf8');
          const seedSync = gardenSource.split('private syncKanbanSeedLine')[1]?.split('private async renderGardenCanvas')[0] ?? '';
          if (/\.style\./.test(seedSync)) {
            throw new Error('Seed-horizon code uses direct style assignment instead of Obsidian CSS helpers');
          }
          NODE
      - name: Attest the release files
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            obsidian-plugin/main.js
            obsidian-plugin/styles.css
            obsidian-plugin/manifest.json
      # Publish before the generated-build commit moves main. This keeps the
      # release tag on the source/version commit and minimizes the window where
      # Obsidian can see a new manifest version before its matching release.
      - name: Publish the release for a new version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version exists."
            exit 0
          fi
          gh release create "$version" obsidian-plugin/main.js obsidian-plugin/manifest.json obsidian-plugin/styles.css \
            --target "$(git rev-parse HEAD)" --title "$version" --notes "cells.garden for Obsidian, version $version."
      # A push made with the workflow's own token does not start the workflow again.
      - name: Commit the build if it changed
        run: |
          git add obsidian-plugin/main.js obsidian-plugin/styles.css obsidian-plugin/manifest.json
          if git diff --cached --quiet; then
            echo "The committed build is current."
            exit 0
          fi
          git config user.name tastefinger
          git config user.email 41840333+lukketsvane@users.noreply.github.com
          git commit -m "Build the Obsidian plugin"
          # main/dev may have moved while this build was running (for example
          # another quick push). Rebase the generated build instead of dropping it.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
