# Build/test runs read-only. Only the main-only release job receives write,
# attestation and OIDC permissions after the verified artifact exists.
name: Build the Obsidian plugin

on:
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'ext/**'
      - 'public/privacy/oauth-return.html'
      - 'public/privacy/oauth-return.js'
      - 'obsidian-plugin/**'
      - 'scripts/test-security.mjs'
      - 'scripts/test-obsidian.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vite.obsidian.config.ts'
      - 'vercel.json'
      - 'manifest.json'
      - '.env'
      - '.github/workflows/obsidian-plugin.yml'

concurrency:
  group: obsidian-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Production dependency audit
        run: npm run audit:prod
      - name: Security invariants
        run: npm run test:security
      - name: Verify Figma asset contract
        run: npm run verify:figma-assets
      - name: Typecheck Chrome extension
        run: npm run typecheck:ext
      - name: Build Chrome extension
        run: npm run build:ext
      - run: npm run build:obsidian
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Obsidian plugin smoke
        run: npm run test:obsidian
      - name: Check compact Obsidian kanban
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const css = fs.readFileSync('obsidian-plugin/styles.css', 'utf8');
          if (!/\.kanban-scroll-container\s+\.project-column\s*\{[^}]*display:\s*flex/s.test(css)) throw new Error('Missing compact kanban layout');
          if (/\.kanban-scroll-container\s+\.project-column\s*\{[^}]*grid-template-rows:\s*subgrid/s.test(css)) throw new Error('Shared-row spacing remains');
          const js = fs.readFileSync('obsidian-plugin/main.js', 'utf8');
          if (/navigator\.clipboard|\.clipboardData\b/.test(js)) throw new Error('Obsidian build accesses system clipboard');
          if (/loadLocalStorage|saveLocalStorage/.test(js)) throw new Error('Obsidian build uses legacy local storage');
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: obsidian-plugin-release
          path: |
            obsidian-plugin/main.js
            obsidian-plugin/styles.css
            obsidian-plugin/manifest.json
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: obsidian-plugin-release
          path: obsidian-plugin
      - name: Commit the verified build if it changed
        run: |
          git add obsidian-plugin/main.js obsidian-plugin/styles.css obsidian-plugin/manifest.json
          if ! git diff --cached --quiet; then
            git config user.name tastefinger
            git config user.email 41840333+lukketsvane@users.noreply.github.com
            git commit -m "Build the Obsidian plugin"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Attest the verified release files
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            obsidian-plugin/main.js
            obsidian-plugin/styles.css
            obsidian-plugin/manifest.json
      - name: Publish the release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version exists."
            exit 0
          fi
          gh release create "$version" obsidian-plugin/main.js obsidian-plugin/manifest.json obsidian-plugin/styles.css \
            --target "$(git rev-parse HEAD)" --title "$version" --notes "cells.garden for Obsidian, version $version."
