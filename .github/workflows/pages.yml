# Production deploy of the web app to GitHub Pages on every push to main.
# Stopgap while the Vercel team is reactivated; vercel.json stays the primary target.
#
# Publishes dist/ to the gh-pages branch. A public repo serves that branch
# automatically; if not, pick "gh-pages" as the source under Settings → Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /cells.garden/
      # Pages would otherwise run Jekyll over the output and drop _-prefixed files.
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"
