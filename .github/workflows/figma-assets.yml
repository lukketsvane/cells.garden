name: Figma asset contract

on:
  push:
    branches: [main, dev]
    paths:
      - "figma/exports.json"
      - "src/assets/**"
      - "scripts/verify-figma-assets.mjs"
      - "scripts/sync-figma-assets.mjs"
      - "package.json"
      - ".github/workflows/figma-assets.yml"
  pull_request:
    paths:
      - "figma/exports.json"
      - "src/assets/**"
      - "scripts/verify-figma-assets.mjs"
      - "scripts/sync-figma-assets.mjs"
      - "package.json"
      - ".github/workflows/figma-assets.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Security invariants
        run: node scripts/test-security.mjs
      - name: Check Figma sync script syntax
        run: node --check scripts/sync-figma-assets.mjs
      - run: npm run verify:figma-assets
