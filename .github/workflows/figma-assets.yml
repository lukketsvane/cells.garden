name: Figma asset contract

on:
  push:
    branches: [main, dev]
    paths:
      - 'figma/**'
      - 'src/assets/**'
      - 'scripts/figma*.mjs'
      - 'scripts/*figma*.mjs'
      - 'package.json'
      - '.github/workflows/*figma*.yml'
  pull_request:
    paths:
      - 'figma/**'
      - 'src/assets/**'
      - 'scripts/*figma*.mjs'
      - 'package.json'
      - '.github/workflows/*figma*.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - run: node scripts/test-security.mjs
      - run: node --check scripts/figma-release.mjs
      - run: npm run test:figma-publishing
      - run: npm run verify:figma-assets
