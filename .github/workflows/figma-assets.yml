name: Figma asset contract
on:
  push:
    branches: [main, dev]
    paths: ["figma/**","src/assets/**","scripts/pull-figma-dev.mjs","scripts/promote-figma-dev.mjs",".github/workflows/figma-assets.yml"]
  pull_request:
    paths: ["figma/**","src/assets/**","scripts/pull-figma-dev.mjs","scripts/promote-figma-dev.mjs"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - run: node scripts/test-security.mjs
      - run: node --check scripts/pull-figma-dev.mjs
      - run: node --check scripts/promote-figma-dev.mjs
      - run: npm run verify:figma-assets
