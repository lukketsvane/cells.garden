name: Promote Figma artwork to production
on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Exact Figma revision verified on dev.cells.garden'
        required: true
        type: string
      confirm:
        description: 'Promote only approved artwork to cells.garden'
        required: true
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: figma-production-artwork
  cancel-in-progress: false
jobs:
  promote:
    if: inputs.confirm == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - run: git fetch origin dev
      - name: Verify requested revision on dev
        run: node scripts/verify-figma-host.mjs dev.cells.garden figma-dev-state.json ${{ inputs.revision }}
      - name: Stage approved artwork
        run: node scripts/promote-figma-dev.mjs ${{ inputs.revision }}
      - name: Validate production
        run: |
          npm ci --ignore-scripts
          npm run verify:figma-assets
          npm run typecheck
          npm run lint
          npm run build
          npx playwright install --with-deps chromium
          npm run test:web
      - name: Commit production artwork
        run: |
          git config user.name tastefinger
          git config user.email 41840333+lukketsvane@users.noreply.github.com
          git add src/assets public/figma-production-state.json
          git commit -m "Promote approved Figma artwork"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify cells.garden
        run: node scripts/verify-figma-host.mjs cells.garden figma-production-state.json ${{ inputs.revision }}
