name: Inspect Figma assets (read only)

on:
  workflow_dispatch:
    inputs:
      asset_path:
        description: 'Exact PNG path, or empty for all mapped artwork. Publishing uses Dev ready instead.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Read-only diagnostic; never publish unapproved live drafts
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_ASSET_PATH: ${{ inputs.asset_path }}
          FIGMA_CHECK_ONLY: '1'
        run: npm run sync:figma-assets
